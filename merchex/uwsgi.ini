[uwsgi]
chdir = /app
module = merchex.wsgi:application
master = true
processes = 4
threads = 2
enable-threads = true
http = :8000
vacuum = true
die-on-term = true
log-5xx = true
log-4xx = true

; Fichiers statiques servis par uWSGI lui-meme.
; Avec DEBUG = False, Django refuse de servir /static/ : sans cette carte,
; les images des cartes de l'accueil repondent 404 en production. Le faire
; ici plutot que par WhiteNoise evite d'ajouter une dependance, et plutot
; que par le proxy evite de dependre d'un reglage DSM invisible depuis le
; depot. Le chemin doit correspondre a STATIC_ROOT de settings_nas.
static-map = /static=/app/staticfiles
; Les noms de fichiers ne portent pas d'empreinte : une journee de cache
; suffit, sans risquer de figer une image remplacee.
static-expires = /app/staticfiles/* 86400
