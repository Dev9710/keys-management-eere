{% extends 'listings/base.html' %}
{% load static %}

{% block title %}Synthèse des clés | EERE{% endblock %}

{% block extra_css %}
/* ═══════════════════════════════════════════════════
   SYNTHÈSE DES CLÉS — design system EERE
   IMPORTANT : injecte a l'interieur du <style> de base.html.
   NE JAMAIS rouvrir de balise <style> ici. CSS brut uniquement.
═══════════════════════════════════════════════════ */
:root {
  --teal:#3a9f87; --teal-dark:#2a7562; --teal-light:#edf7f5;
  --grad:linear-gradient(135deg,#0d3028 0%,#1a5040 100%);
  --orange:#FFA500; --bg-page:#f6f9f8; --bg-white:#fff;
  --border:#e8f0ed; --border-2:#e2e8f0;
  --text:#0f172a; --text-2:#64748b; --text-3:#94a3b8;
}
.syn { width:100%; max-width:1320px; margin:0 auto; padding:1.5rem 2rem 2.5rem; box-sizing:border-box; font-family:'DM Sans',sans-serif; }

.syn-head { margin-bottom:1.4rem; }
.syn-head h1 { font-family:'DM Serif Display',serif; font-size:1.85rem; color:#0d3028; font-weight:400; margin:0 0 .25rem; }
.syn-head p { font-size:.92rem; color:var(--text-2); margin:0; max-width:62ch; }

/* messages */
.syn .alert { border-radius:12px; border:1px solid var(--border); font-family:'DM Sans',sans-serif; }

/* KPIs */
.syn-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.4rem; }
.kpi { display:flex; align-items:center; gap:.9rem; background:var(--bg-white); border:1px solid var(--border); border-radius:14px; padding:1.05rem 1.2rem; box-shadow:0 1px 3px rgba(13,48,40,.05); }
.kpi-ic { width:48px; height:48px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:1.15rem; }
.kpi-ic.teal{background:var(--teal-light);color:var(--teal-dark);} .kpi-ic.green{background:#f0fdf4;color:#16a34a;}
.kpi-ic.blue{background:#eef2ff;color:#4f46e5;} .kpi-ic.amber{background:#fff7ed;color:#b45309;}
.kpi-v { font-family:'DM Serif Display',serif; font-size:1.7rem; color:var(--text); line-height:1; }
.kpi-l { font-size:.8rem; color:var(--text-2); margin-top:.15rem; }

/* barre d'outils */
.syn-toolbar { display:flex; align-items:flex-end; gap:.75rem; flex-wrap:wrap; background:var(--bg-white); border:1px solid var(--border); border-radius:14px; padding:.95rem 1rem; box-shadow:0 1px 3px rgba(13,48,40,.04); margin-bottom:1rem; }
.syn-search { position:relative; flex:1 1 260px; min-width:200px; }
.syn-search i { position:absolute; left:.9rem; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:.9rem; pointer-events:none; }
.syn-search input { width:100%; padding:.62rem .9rem .62rem 2.4rem; border:1.5px solid var(--border-2); border-radius:11px; font-family:'DM Sans',sans-serif; font-size:.9rem; color:var(--text); background:var(--bg-page); outline:none; box-sizing:border-box; transition:border-color .2s,box-shadow .2s,background .2s; }
.syn-search input:focus { border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px rgba(58,159,135,.12); }
.fgroup { display:flex; flex-direction:column; gap:.35rem; }
.flabel { font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); }
.fselect { padding:.6rem .8rem; border:1.5px solid var(--border-2); border-radius:11px; font-family:'DM Sans',sans-serif; font-size:.88rem; color:var(--text); background:#fff; outline:none; min-width:180px; transition:border-color .2s,box-shadow .2s; }
.fselect:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(58,159,135,.12); }
.fcheck { display:inline-flex; align-items:center; gap:.5rem; font-size:.86rem; color:var(--text); cursor:pointer; user-select:none; padding-bottom:.6rem; }
.fcheck input { width:17px; height:17px; accent-color:var(--teal); cursor:pointer; }
.tbtn { display:inline-flex; align-items:center; gap:7px; padding:.62rem 1.1rem; border-radius:11px; font-family:'DM Sans',sans-serif; font-size:.86rem; font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap; border:1.5px solid var(--border-2); background:#fff; color:var(--text-2); transition:all .16s ease; }
.tbtn:hover { border-color:#cbd5e1; color:var(--text); background:var(--bg-page); }
.tbtn.primary { background:var(--teal); border-color:var(--teal); color:#fff; }
.tbtn.primary:hover { background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; box-shadow:0 4px 12px rgba(58,159,135,.3); }

/* table */
.syn-table-wrap { background:var(--bg-white); border:1px solid var(--border); border-radius:14px; overflow-x:auto; box-shadow:0 4px 16px rgba(13,48,40,.06),0 1px 3px rgba(13,48,40,.04); margin-bottom:1.25rem; }
.syn-table { width:100%; border-collapse:separate; border-spacing:0; min-width:820px; margin:0; }
.syn-table thead th { background:var(--teal); color:#fff; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:.8rem 1rem; text-align:left; white-space:nowrap; position:sticky; top:0; z-index:2; }
.syn-table thead th:first-child { border-radius:14px 0 0 0; }
.syn-table thead th:last-child { border-radius:0 14px 0 0; }
.syn-table thead th.center { text-align:center; }
.syn-table tbody td { padding:.8rem 1rem; font-size:.86rem; color:var(--text); border-bottom:1px solid #f1f5f4; vertical-align:middle; }
.syn-table tbody tr { border-left:3px solid transparent; transition:background .14s,border-left-color .14s; }
.syn-table tbody tr:nth-child(even) td { background:#fbfdfc; }
.syn-table tbody tr:hover { border-left-color:var(--teal); }
.syn-table tbody tr:hover td { background:var(--teal-light); }
.syn-table tbody tr:last-child td { border-bottom:none; }
.team-tag { display:inline-flex; align-items:center; gap:.4rem; font-weight:600; color:#0d3028; }
.team-tag i { color:var(--teal); font-size:.8rem; }
.u-cell { display:flex; align-items:center; gap:.6rem; }
.u-av { width:32px; height:32px; border-radius:50%; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.74rem; font-weight:600; flex-shrink:0; }
.kcount { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:26px; padding:0 .5rem; border-radius:50px; font-size:.8rem; font-weight:700; }
.kcount.has { background:var(--teal-light); color:var(--teal-dark); }
.kcount.none { background:#f1f5f9; color:var(--text-3); }
.keys-list { max-width:340px; }
.key-item { display:inline-block; background:var(--teal-light); color:var(--teal-dark); border:1px solid rgba(58,159,135,.22); padding:.18rem .5rem; margin:.12rem; border-radius:7px; font-size:.78rem; font-weight:600; }
.no-key { color:var(--text-3); font-style:italic; font-size:.83rem; }
.cmt { color:var(--text-2); font-size:.83rem; }

/* animation lignes */
@keyframes rowIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
.syn-table tbody tr.anim { animation:rowIn .4s cubic-bezier(.4,0,.2,1) both; }
.syn-table tbody tr.anim:nth-child(1){animation-delay:.02s} .syn-table tbody tr.anim:nth-child(2){animation-delay:.05s}
.syn-table tbody tr.anim:nth-child(3){animation-delay:.08s} .syn-table tbody tr.anim:nth-child(4){animation-delay:.11s}
.syn-table tbody tr.anim:nth-child(5){animation-delay:.14s} .syn-table tbody tr.anim:nth-child(6){animation-delay:.17s}
.syn-table tbody tr.anim:nth-child(7){animation-delay:.20s} .syn-table tbody tr.anim:nth-child(8){animation-delay:.23s}
.syn-table tbody tr.anim:nth-child(9){animation-delay:.26s} .syn-table tbody tr.anim:nth-child(10){animation-delay:.29s}
@media (prefers-reduced-motion:reduce){ .syn-table tbody tr.anim{animation:none;} }

/* etat vide */
.syn-empty { text-align:center; padding:3.5rem 1rem; color:var(--text-2); }
.syn-empty i { font-size:2.4rem; color:var(--text-3); margin-bottom:.8rem; }
.syn-empty .empty-t { font-weight:600; color:var(--text); margin-bottom:.25rem; }

/* stats par equipe */
.team-section { margin-bottom:1.25rem; }
.team-section h2 { font-family:'DM Serif Display',serif; font-weight:400; font-size:1.25rem; color:#0d3028; margin:0 0 1rem; display:flex; align-items:center; gap:.55rem; }
.team-section h2 i { color:var(--teal); font-size:1rem; }
.team-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:1rem; }
.team-card { background:var(--bg-white); border:1px solid var(--border); border-radius:14px; padding:1.1rem 1.25rem; box-shadow:0 1px 3px rgba(13,48,40,.05); transition:box-shadow .2s,transform .12s; }
.team-card:hover { box-shadow:0 8px 22px rgba(13,48,40,.1); transform:translateY(-2px); }
.team-card-name { font-weight:700; color:#0d3028; font-size:1rem; margin-bottom:.9rem; display:flex; align-items:center; gap:.5rem; }
.team-card-name i { color:var(--teal); }
.team-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; text-align:center; }
.tm { background:var(--bg-page); border-radius:10px; padding:.7rem .4rem; }
.tm-n { font-family:'DM Serif Display',serif; font-size:1.35rem; color:var(--teal-dark); line-height:1; }
.tm-l { font-size:.7rem; color:var(--text-2); margin-top:.35rem; }

/* export */
.syn-export { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; background:var(--bg-white); border:1px solid var(--border); border-radius:14px; padding:1rem 1.25rem; box-shadow:0 1px 3px rgba(13,48,40,.04); }
.syn-export .lbl { font-size:.88rem; color:var(--text-2); }
.syn-export .lbl strong { color:#0d3028; }

.scroll-hint { display:none; font-size:.76rem; color:var(--text-3); margin:.5rem .25rem 0; }

@media (max-width:992px){ .syn{padding:1.25rem 1rem 2rem;} .syn-kpis{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .syn-head h1{font-size:1.5rem;} .syn-kpis{grid-template-columns:1fr 1fr;gap:.7rem;} .fselect{min-width:0;width:100%;} .fgroup,.syn-search{flex:1 1 100%;} .tbtn{flex:1 1 auto;justify-content:center;} .scroll-hint{display:block;} }
{% endblock %}

{% block content %}
<div class="syn">

  {% if messages %}
  <div class="mb-3">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="syn-head">
    <h1>Tableau de synthèse des clés</h1>
    <p>Vue d'ensemble des membres et des clés qui leur sont attribuées. Filtrez par équipe, recherchez un membre et exportez les données.</p>
  </div>

  <!-- KPIs -->
  <div class="syn-kpis">
    <div class="kpi"><div class="kpi-ic teal"><i class="fas fa-users"></i></div><div><div class="kpi-v">{{ stats.total_users }}</div><div class="kpi-l">Membres</div></div></div>
    <div class="kpi"><div class="kpi-ic green"><i class="fas fa-key"></i></div><div><div class="kpi-v">{{ stats.users_with_keys }}</div><div class="kpi-l">Membres avec clés</div></div></div>
    <div class="kpi"><div class="kpi-ic amber"><i class="fas fa-layer-group"></i></div><div><div class="kpi-v">{{ stats.total_keys_assigned }}</div><div class="kpi-l">Clés attribuées</div></div></div>
    <div class="kpi"><div class="kpi-ic blue"><i class="fas fa-people-group"></i></div><div><div class="kpi-v">{{ stats.teams_count }}</div><div class="kpi-l">Équipes actives</div></div></div>
  </div>

  <!-- Barre d'outils / filtres -->
  <form method="get" id="synForm">
    <div class="syn-toolbar">
      <div class="syn-search">
        <i class="fas fa-search"></i>
        <input type="text" name="search" id="search" placeholder="Nom, prénom, équipe…" value="{{ filters.search_query }}" aria-label="Rechercher">
      </div>
      <div class="fgroup">
        <label for="team" class="flabel">Équipe</label>
        <select name="team" id="team" class="fselect">
          <option value="">Toutes les équipes</option>
          {% for team in all_teams %}
          <option value="{{ team.id }}" {% if team.id|stringformat:"s" == filters.selected_team_id %}selected{% endif %}>{{ team.name }}</option>
          {% endfor %}
        </select>
      </div>
      <label class="fcheck">
        <input type="checkbox" name="with_keys" value="true" {% if filters.show_only_with_keys %}checked{% endif %}>
        Uniquement avec clés
      </label>
      <button type="submit" class="tbtn primary"><i class="fas fa-search"></i> Filtrer</button>
      <a href="{% url 'synthesis_table' %}" class="tbtn"><i class="fas fa-times"></i> Réinitialiser</a>
    </div>
  </form>

  <p class="scroll-hint"><i class="fas fa-arrows-left-right"></i> Faites défiler le tableau horizontalement</p>

  <!-- Tableau -->
  <div class="syn-table-wrap">
    {% if table_data %}
    <table class="syn-table">
      <thead>
        <tr>
          <th>Équipe</th>
          <th>Membre</th>
          <th class="center">Nb de clés</th>
          <th>Clés attribuées</th>
          <th>Commentaires</th>
        </tr>
      </thead>
      <tbody>
        {% for user in table_data %}
        <tr class="anim">
          <td><span class="team-tag"><i class="fas fa-people-group"></i> {{ user.team }}</span></td>
          <td><div class="u-cell"><span class="u-av">{{ user.firstname|slice:":1"|upper }}{{ user.name|slice:":1"|upper }}</span><span>{{ user.full_name }}</span></div></td>
          <td style="text-align:center;"><span class="kcount {% if user.has_keys %}has{% else %}none{% endif %}">{{ user.keys_count }}</span></td>
          <td class="keys-list">
            {% if user.keys %}
              {% for key in user.keys %}<span class="key-item" title="{{ key.name }} — {{ key.place }}">#{{ key.number }}</span>{% endfor %}
            {% else %}<span class="no-key">Aucune clé</span>{% endif %}
          </td>
          <td><span class="cmt">{{ user.comment|default:"—" }}</span></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <div class="syn-empty">
      <i class="fas fa-user-slash"></i>
      <div class="empty-t">Aucun membre trouvé</div>
      <div>Essayez de modifier ou de réinitialiser vos filtres.</div>
    </div>
    {% endif %}
  </div>

  <!-- Stats par équipe -->
  {% if team_stats %}
  <div class="team-section">
    <h2><i class="fas fa-chart-bar"></i> Statistiques par équipe</h2>
    <div class="team-grid">
      {% for team in team_stats %}
      <div class="team-card">
        <div class="team-card-name"><i class="fas fa-people-group"></i> {{ team.team_name }}</div>
        <div class="team-metrics">
          <div class="tm"><div class="tm-n">{{ team.total_members }}</div><div class="tm-l">Membres</div></div>
          <div class="tm"><div class="tm-n">{{ team.members_with_keys }}</div><div class="tm-l">Avec clés</div></div>
          <div class="tm"><div class="tm-n">{{ team.total_keys }}</div><div class="tm-l">Total clés</div></div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <!-- Export -->
  <div class="syn-export">
    <div class="lbl"><strong>Export des données</strong> — télécharge la sélection courante au format CSV.</div>
    <a href="{% url 'synthesis_export' %}?{{ request.GET.urlencode }}" class="tbtn primary"><i class="fas fa-file-csv"></i> Exporter CSV</a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  // Auto-soumission sur changement d'équipe / case à cocher
  var teamSelect = document.getElementById('team');
  var withKeys = document.querySelector('input[name="with_keys"]');
  if (teamSelect) teamSelect.addEventListener('change', function () { this.form.submit(); });
  if (withKeys) withKeys.addEventListener('change', function () { this.form.submit(); });
});
</script>
{% endblock %}
