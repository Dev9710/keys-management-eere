version: "3.8"

services:
  db:
    image: mysql:8.4.8
    container_name: merchex-db
    # always, et surtout pas unless-stopped : ce dernier memorise un arret
    # manuel de facon permanente (bouton Arreter de Container Manager,
    # docker stop) et ne redemarre plus le conteneur, pas meme au reboot du
    # NAS. Un arret ponctuel devenait ainsi une panne definitive et
    # silencieuse de la base, l'application repartant seule de son cote.
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: merchex
      MYSQL_USER: merchex
      MYSQL_PASSWORD: password
    volumes:
      - merchex_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"   # <-- important pour Web Station
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - merchex_net

  adminer:
    image: adminer:4
    container_name: merchex-adminer
    restart: always
    depends_on:
      - db
    ports:
      - "8082:8080"
    networks:
      - merchex_net

volumes:
  merchex_mysql_data:
    external: true

networks:
  merchex_net:
    name: merchex_net
    driver: bridge
